import groovy.json.JsonSlurper

def loadFlavorVersion(String appFlavor, String envFlavor) {
    def versionsFile = rootProject.file('../app.versions.json')
    if (versionsFile.exists()) {
        try {
            def parsed = new JsonSlurper().parse(versionsFile)
            if (parsed[appFlavor] && parsed[appFlavor][envFlavor]) {
                return parsed[appFlavor][envFlavor]
            }
        } catch (Exception e) {
            logger.warn("Failed to parse app.versions.json: " + e.message)
        }
    }
    return [versionCode: 1, versionName: "1.0.0"]
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { stream ->
        keystoreProperties.load(stream)
    }
}

def resolveSigningProp = { String key ->
    def val = keystoreProperties.getProperty(key)
    if (val == null || val.trim().isEmpty()) {
        val = project.findProperty(key)?.toString()
    }
    if (val == null || val.trim().isEmpty()) {
        val = System.getenv(key)
    }
    return val?.trim() ?: null
}

def configureReleaseSigning = { signingCfg, String prefix ->
    def storeFileName = resolveSigningProp("${prefix}_UPLOAD_STORE_FILE")
    def storePwd = resolveSigningProp("${prefix}_UPLOAD_STORE_PASSWORD")
    def keyAliasVal = resolveSigningProp("${prefix}_UPLOAD_KEY_ALIAS")
    def keyPwd = resolveSigningProp("${prefix}_UPLOAD_KEY_PASSWORD")

    if (storeFileName && storePwd && keyAliasVal && keyPwd) {
        def resolvedStoreFile = file(storeFileName)
        if (resolvedStoreFile.exists()) {
            signingCfg.storeFile = resolvedStoreFile
            signingCfg.storePassword = storePwd
            signingCfg.keyAlias = keyAliasVal
            signingCfg.keyPassword = keyPwd
            return true
        } else {
            logger.warn("Keystore file not found for ${prefix}: ${resolvedStoreFile}. Falling back to debug signing.")
        }
    } else {
        logger.warn("Release signing credentials not configured for ${prefix}. Falling back to debug signing.")
    }
    return false
}

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    debuggableVariants = [
        "saccoDevDebug", "saccoStagingDebug", "saccoProdDebug",
        "horecaDevDebug", "horecaStagingDebug", "horecaProdDebug"
    ]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.baigamats.app"
    defaultConfig {
        applicationId "com.baigamats.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        saccoRelease {
            enableV1Signing true
            enableV2Signing true
        }
        horecaRelease {
            enableV1Signing true
            enableV2Signing true
        }
    }

    def hasSaccoSigning = configureReleaseSigning(signingConfigs.saccoRelease, "SACCO")
    def hasHorecaSigning = configureReleaseSigning(signingConfigs.horecaRelease, "HORECA")

    flavorDimensions "app", "env"
    productFlavors {
        sacco {
            dimension "app"
            applicationId "com.baigamats.app"
            resValue "string", "app_name", "Baigamats"
            signingConfig hasSaccoSigning ? signingConfigs.saccoRelease : signingConfigs.debug
        }
        horeca {
            dimension "app"
            applicationId "com.baigamats.horeca"
            resValue "string", "app_name", "Baigamats HORECA"
            signingConfig hasHorecaSigning ? signingConfigs.horecaRelease : signingConfigs.debug
        }
        dev {
            dimension "env"
            applicationIdSuffix ".dev"
        }
        staging {
            dimension "env"
            applicationIdSuffix ".staging"
        }
        prod {
            dimension "env"
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
    applicationVariants.all { variant ->
        def appFlavor = variant.productFlavors.find { it.dimension == "app" }?.name
        def envFlavor = variant.productFlavors.find { it.dimension == "env" }?.name
        if (appFlavor && envFlavor) {
            def ver = loadFlavorVersion(appFlavor, envFlavor)
            variant.outputs.all { output ->
                output.versionCodeOverride = ver.versionCode as Integer
                output.versionNameOverride = ver.versionName as String
            }
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

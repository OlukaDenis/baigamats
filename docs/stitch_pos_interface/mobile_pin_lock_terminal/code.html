<script>
  (() => {
    let pin = '842';
    const maxDigits = 4;
    const dots = document.querySelectorAll('.pin-dot');
    const keypadButtons = document.querySelectorAll('.keypad-btn');
    const btnClr = document.getElementById('btn-clr');
    const btnDel = document.getElementById('btn-del');
    const staffLabel = document.getElementById('staff-name-label');
    const staffPills = document.querySelectorAll('.staff-pill');

    function renderDots() {
      dots.forEach((dot, index) => {
        if (index < pin.length) {
          dot.className = 'pin-dot w-4 h-4 rounded-full bg-primary shadow-sm transition-all duration-150';
        } else {
          dot.className = 'pin-dot w-4 h-4 rounded-full bg-surface-container-highest transition-all duration-150';
        }
      });
    }

    keypadButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        if (pin.length < maxDigits) {
          pin += btn.getAttribute('data-val');
          renderDots();

          if (pin.length === maxDigits) {
            setTimeout(() => {
              pin = '';
              renderDots();
            }, 400);
          }
        }
      });
    });

    btnClr.addEventListener('click', () => {
      pin = '';
      renderDots();
    });

    btnDel.addEventListener('click', () => {
      if (pin.length > 0) {
        pin = pin.slice(0, -1);
        renderDots();
      }
    });

    staffPills.forEach(pill => {
      pill.addEventListener('click', () => {
        staffPills.forEach(p => {
          p.classList.remove('bg-surface-container-highest', 'opacity-100');
          p.classList.add('bg-surface-container-low', 'opacity-70');
          const title = p.querySelector('span:first-child');
          if (title) {
            title.className = 'font-headline-sm text-[12px] text-on-surface leading-tight font-semibold';
          }
        });

        pill.classList.remove('bg-surface-container-low', 'opacity-70');
        pill.classList.add('bg-surface-container-highest', 'opacity-100');
        const activeTitle = pill.querySelector('span:first-child');
        if (activeTitle) {
          activeTitle.className = 'font-headline-sm text-[12px] text-primary leading-tight font-semibold';
        }

        const name = pill.getAttribute('data-name');
        const role = pill.getAttribute('data-role');
        if (staffLabel) {
          staffLabel.textContent = `${name} • ${role}`;
        }

        pin = '';
        renderDots();
      });
    });

    // Simple digital clock refresh
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const clockEl = document.getElementById('live-clock');
      if (clockEl) {
        clockEl.textContent = `${hours}:${minutes}`;
      }
    }
    setInterval(updateClock, 1000);
  })();
